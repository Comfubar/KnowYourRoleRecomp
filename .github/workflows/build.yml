name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build KnowYourRole.exe (setup and launcher; the game itself is built from the player's disc)
        run: dotnet build Launcher/KnowYourRole.Launcher.csproj -c Release
